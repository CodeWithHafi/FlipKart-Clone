<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flipkart</title>
    <!--Logo-->
    <link rel="website icon" type="png" href="./imges/FlipKart Logo.png">
    <!--Styles-->
    <link rel="Stylesheet" href="styles.css" />
    <!--Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!--header Section-->
    <div class="header">
        <div class="header-flipkart">
            <img src="./imges/FlipKart Logo.png" alt="">
            <h2>Flipkart</h2>

        </div>

        <div class="header-grocery">
            <img src="./imges/FlipKart Logo.png" alt="">
            <h2>Grocery</h2>


        </div>

    </div>

    <div class="search-bar">
        <i class="fas fa-search search-icon"></i>
        <input type="text" placeholder="Search for products">
        <div class="search-icons">
            <i class="fas fa-microphone mic-icon"></i>
            <i class="fas fa-camera camera-icon"></i>
        </div>
    </div>

    <!--header section end-->

    <!--Notice Sliders-->

    <div class="notice-sliders">
        <img src="./imges/Slider 1.jpg" alt="">
        <img src="./imges/Slider 2.jpg" alt="">
        <img src="./imges/Slider 3.jpg" alt="">

    </div>

    <!--Notice Sliders Ends-->

    <!--Products-->
    <div class="">
        <div class="products">
            <div class="shorcuts"></div>
            <div class="shorcuts"></div>
            <div class="shorcuts"></div>
            <div class="shorcuts"></div>
            <div class="shorcuts"></div>
        </div>
        <div class="offers">
            <div class="ads">
                <div class="ads-title"></div>
            </div>
            <div class="ads">
                <div class="ads-title"></div>
            </div>
            <div class="ads">
                <div class="ads-title"></div>
            </div>
        </div>
    </div>

    <!--Products End-->

    <!--recently viewed-->
    <h3 style="margin-bottom: 10px;">Recently Viewed Stores</h3>
    <div class="recently-viewed">
        <div class="viewed"></div>
        <div class="viewed"></div>
        <div class="viewed"></div>
        <div class="viewed"></div>
        <div class="viewed"></div>
         
    </div>
    
    <!--recently viewed end-->

    <!--footer-->
    <div class="footer">
        <div class="footer-content">
            

        </div>
    </div>
    <!--footer end-->


   
</body>
</html>
